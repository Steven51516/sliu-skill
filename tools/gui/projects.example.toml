# research-gui projects: copy to ~/.config/research-gui/projects.toml
port = 8765
terminal_app = "Terminal"              # brought to the front by "Focus in herdr"; omit to only switch herdr's tab
keychain_service = "claude-code-oauth" # Keychain item holding CLAUDE_CODE_OAUTH_TOKEN; store it with
                                       #   security add-generic-password -a "$USER" -s claude-code-oauth -w
roots = ["~/projects"]  # folders searched for unregistered projects (a maps/ inside)

[defaults]
claude_args = []                       # extra flags for every agent the GUI starts

[defaults.role_env.desk]               # environment per role; tokens never go here
CLAUDE_BELL = "1"

[defaults.role_env.driver]

[projects.example]
path = "~/projects/example"
server = "gpu-server"                 # ssh alias
server_root = "~/code/example"         # the project's code on the server
server_maps = "maps"                   # where map folders live under server_root (same names as maps/ on the Mac)
shared = ["common"]                    # server folders pinned beside every map's code
# claude_args = ["--model", "opus"]    # per project, overrides defaults.claude_args
# [projects.example.role_env.desk]     # per project, overrides a role's defaults
